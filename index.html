<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOME AIRPORT — Ticket Generator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef1f7;
    font-family:Arial, sans-serif;
    color:#111;
}

.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}

.panel{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 5px 25px #0002;
}

h1{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    margin-top:5px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    margin-top:16px;
    padding:13px 20px;
    border:0;
    border-radius:10px;
    background:#1515aa;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button.print{
    background:#e6e6ed;
    color:#111;
    margin-left:8px;
}


/* КВИТОК */

.ticket{
    background:white;
    max-width:850px;
    margin:auto;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 8px 30px #0002;
}

.top{
    padding:22px 28px;
}

.airportTitle{
    font-size:24px;
    font-weight:bold;
}

.route{
    display:flex;
    align-items:center;
    gap:20px;
    margin-top:25px;
}

.airport{
    font-size:65px;
    font-weight:bold;
}

.line{
    flex:1;
    height:4px;
    background:#888;
    position:relative;
}

.line::after{
    content:"✈";
    position:absolute;
    left:50%;
    top:-25px;
    transform:translateX(-50%);
    font-size:35px;
}

.small{
    color:#777;
    font-size:17px;
    margin-top:6px;
}

.passenger{
    font-size:27px;
    font-weight:bold;
    margin-top:25px;
}

.flight{
    color:#777;
    font-size:18px;
    margin-top:5px;
}

.blue{
    background:#1515aa;
    color:white;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    text-align:center;
    padding:15px;
}

.blue small{
    font-size:13px;
}

.blue strong{
    display:block;
    font-size:30px;
    margin-top:4px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:15px;
    padding:22px 28px;
}

.info b{
    display:block;
    color:#777;
    font-size:13px;
}

.info span{
    display:block;
    font-size:21px;
    font-weight:bold;
    margin-top:4px;
}

.barcode{
    padding:10px 28px 25px;
    text-align:center;
}

.barcode img{
    width:100%;
    max-width:700px;
    height:110px;
    object-fit:contain;
}

.barcodeText{
    font-family:monospace;
    font-size:14px;
    margin-top:5px;
}

.footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:0 20px 20px;
}

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr;
    }

    .airport{
        font-size:48px;
    }

    .info{
        grid-template-columns:1fr 1fr;
    }

    .top{
        padding:18px;
    }

    .info{
        padding:18px;
    }

    .barcode{
        padding-left:18px;
        padding-right:18px;
    }
}


/* ДРУК */

@media print{

    body{
        background:white;
    }

    .panel{
        display:none;
    }

    .container{
        padding:0;
    }

    .ticket{
        box-shadow:none;
        max-width:none;
    }
}
</style>
</head>


<body>

<div class="container">

<!-- ПАНЕЛЬ -->

<div class="panel">

<h1>✈️ HOME AIRPORT</h1>

<div class="grid">

<label>
Ім'я та прізвище
<input id="name" value="SEBASTIAN FUTYMA">
</label>

<label>
Рейс
<input id="flight" value="W62449">
</label>

<label>
Звідки
<input id="from" value="KIV">
</label>

<label>
Куди
<input id="to" value="NRV">
</label>

<label>
Дата
<input id="date" value="19 AUG">
</label>

<label>
Виліт
<input id="departure" value="14:40">
</label>

<label>
Gate closes
<input id="gateClose" value="14:35">
</label>

<label>
Gate
<input id="gate" value="07">
</label>

<label>
Seat
<input id="seat" value="19A">
</label>

<label>
Class
<input id="class" value="ECONOMY">
</label>

<label>
Baggage
<input id="baggage" value="1">
</label>

</div>

<button onclick="createTicket()">
🎫 Створити квиток
</button>

<button class="print" onclick="window.print()">
🖨️ Друкувати
</button>

</div>


<!-- КВИТОК -->

<div class="ticket">

<div class="top">

<div class="airportTitle">
✈️ HOME AIRPORT
</div>


<div class="route">

<div>
<div class="airport" id="outFrom">KIV</div>
<div class="small">DEPARTURE</div>
</div>

<div class="line"></div>

<div>
<div class="airport" id="outTo">NRV</div>
<div class="small">ARRIVAL</div>
</div>

</div>


<div class="passenger" id="outName">
SEBASTIAN FUTYMA
</div>

<div class="flight" id="outFlight">
FLIGHT W62449
</div>

</div>


<!-- СИНЯ ПАНЕЛЬ -->

<div class="blue">

<div>
<small>GATE CLOSES</small>
<strong id="outClose">14:35</strong>
</div>

<div>
<small>GATE</small>
<strong id="outGate">07</strong>
</div>

<div>
<small>DEPARTURE</small>
<strong id="outDeparture">14:40</strong>
</div>

</div>


<!-- ІНФО -->

<div class="info">

<div>
<b>DATE</b>
<span id="outDate">19 AUG</span>
</div>

<div>
<b>SEAT</b>
<span id="outSeat">19A</span>
</div>

<div>
<b>PNR</b>
<span id="outPNR">ABC123</span>
</div>

<div>
<b>SEQUENCE</b>
<span id="outSequence">0013</span>
</div>

</div>


<!-- ШТРИХКОД -->

<div class="barcode">

<img id="barcode">

<div class="barcodeText" id="barcodeText">
W62449/ABC123/0013
</div>

</div>


<div class="footer">

PLEASE PRESENT THIS BOARDING PASS AT THE GATE
<br>
BAGGAGE: <span id="outBaggage">1</span>

</div>

</div>

</div>


<script>

/* Генерація PNR */

function generatePNR(){

    let chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for(let i=0;i<6;i++){

        result +=
        chars[Math.floor(Math.random()*chars.length)];

    }

    return result;
}


/* Sequence */

let sequence = 13;


/* Створення квитка */

function createTicket(){

    let name =
    document.getElementById("name").value;

    let flight =
    document.getElementById("flight").value;

    let from =
    document.getElementById("from").value;

    let to =
    document.getElementById("to").value;

    let date =
    document.getElementById("date").value;

    let departure =
    document.getElementById("departure").value;

    let gateClose =
    document.getElementById("gateClose").value;

    let gate =
    document.getElementById("gate").value;

    let seat =
    document.getElementById("seat").value;

    let baggage =
    document.getElementById("baggage").value;


    let pnr = generatePNR();

    let seq =
    String(sequence).padStart(4,"0");

    sequence++;


    document.getElementById("outName")
    .textContent =
    name.toUpperCase();

    document.getElementById("outFlight")
    .textContent =
    "FLIGHT " + flight.toUpperCase();

    document.getElementById("outFrom")
    .textContent =
    from.toUpperCase();

    document.getElementById("outTo")
    .textContent =
    to.toUpperCase();

    document.getElementById("outDate")
    .textContent =
    date.toUpperCase();

    document.getElementById("outDeparture")
    .textContent =
    departure;

    document.getElementById("outClose")
    .textContent =
    gateClose;

    document.getElementById("outGate")
    .textContent =
    gate;

    document.getElementById("outSeat")
    .textContent =
    seat.toUpperCase();

    document.getElementById("outPNR")
    .textContent =
    pnr;

    document.getElementById("outSequence")
    .textContent =
    seq;

    document.getElementById("outBaggage")
    .textContent =
    baggage;


    /*
       Дані квитка
    */

    let barcodeData =
    flight.toUpperCase()
    + from.toUpperCase()
    + to.toUpperCase()
    + pnr
    + seq;


    /*
       Штрихкод через онлайн-генератор
    */

    let barcodeURL =
    "https://barcode.tec-it.com/barcode.ashx"
    + "?data="
    + encodeURIComponent(barcodeData)
    + "&code=Code128"
    + "&translate-esc=on";


    document.getElementById("barcode").src =
    barcodeURL;


    document.getElementById("barcodeText")
    .textContent =
    barcodeData;
}


/* Перший квиток */

createTicket();

</script>

</body>
</html>
