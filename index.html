<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WASH PRO — Автомийка</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f6;
    color: #17202a;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

header p {
    margin: 6px 0 0;
    color: #cbd5e1;
}

nav {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: white;
    overflow-x: auto;
}

nav button {
    border: 0;
    background: #e5e7eb;
    padding: 12px 16px;
    border-radius: 10px;
    white-space: nowrap;
    font-weight: bold;
}

nav button.active {
    background: #111827;
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

h2 {
    margin-top: 0;
}

input, select {
    width: 100%;
    padding: 13px;
    margin: 6px 0 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
}

button {
    cursor: pointer;
}

.main-btn {
    border: 0;
    background: #111827;
    color: white;
    padding: 13px 18px;
    border-radius: 10px;
    font-weight: bold;
}

.green {
    background: #16a34a;
}

.orange {
    background: #f59e0b;
}

.red {
    background: #dc2626;
}

.blue {
    background: #2563eb;
}

.service-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
}

.service {
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    padding: 13px;
    background: #fafafa;
}

.service.selected {
    border-color: #2563eb;
    background: #eff6ff;
}

.service label {
    display: flex;
    gap: 10px;
    align-items: center;
    font-weight: bold;
}

.service input {
    width: auto;
    margin: 0;
}

.service small {
    display: block;
    margin-top: 7px;
    color: #64748b;
}

.timer-box {
    text-align: center;
    background: #111827;
    color: white;
    border-radius: 18px;
    padding: 25px;
}

.timer {
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 2px;
}

.price {
    font-size: 36px;
    color: #86efac;
    font-weight: bold;
    margin: 10px;
}

.buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}

.order {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 15px;
    margin: 10px 0;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 8px;
    background: #e5e7eb;
    font-size: 13px;
    margin-top: 5px;
}

.total {
    font-size: 24px;
    font-weight: bold;
    margin-top: 15px;
}

@media(max-width:600px) {
    .timer {
        font-size: 38px;
    }

    .price {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🚗 WASH PRO</h1>
    <p>Система керування автомийкою</p>
</header>

<nav>
    <button class="active" onclick="showSection('wash', this)">🚗 Мийка</button>
    <button onclick="showSection('booking', this)">📅 Записи</button>
    <button onclick="showSection('history', this)">📋 Історія</button>
    <button onclick="showSection('workers', this)">👥 Співробітники</button>
</nav>

<div class="container">

<!-- МИЙКА -->

<section id="wash" class="section active">

<div class="card">
<h2>🚗 Дані клієнта</h2>

<input id="clientName" placeholder="Ім'я клієнта">

<input id="carBrand" placeholder="Марка авто">

<input id="carModel" placeholder="Модель авто">

<select id="carType">
<option value="">Тип автомобіля</option>
<option>Легкове авто</option>
<option>Кросовер</option>
<option>Позашляховик</option>
<option>Мікроавтобус</option>
</select>

<select id="workerSelect">
<option value="">Оберіть співробітника</option>
</select>
</div>


<div class="card">
<h2>🧽 Послуги</h2>

<button class="main-btn blue" onclick="selectAllCar()">
🚿 ВСЕ АВТО
</button>

<br><br>

<div class="service-grid" id="services"></div>

<div class="total">
Разом за хвилину: <span id="rate">0</span> грн
</div>
</div>


<div class="card">

<div class="timer-box">

<div>⏱️ ЧАС МИЙКИ</div>

<div class="timer" id="timer">
00:00
</div>

<div class="price">
₴ <span id="livePrice">0.00</span>
</div>

<div class="buttons">

<button class="main-btn green" onclick="startTimer()">
▶️ Старт
</button>

<button class="main-btn orange" onclick="pauseTimer()">
⏸️ Пауза
</button>

<button class="main-btn red" onclick="finishWash()">
⏹️ Завершити
</button>

</div>

</div>

</div>

</section>


<!-- БРОНЮВАННЯ -->

<section id="booking" class="section">

<div class="card">

<h2>📅 Новий запис</h2>

<input id="bookName" placeholder="Ім'я клієнта">

<input id="bookCar" placeholder="Марка та модель авто">

<input id="bookDate" type="date">

<input id="bookTime" type="time">

<select id="bookService">
<option>Все авто</option>
<option>Повна зовнішня</option>
<option>Зовнішня + салон</option>
<option>Фари</option>
<option>Дзеркала</option>
<option>Кузов</option>
<option>Салон</option>
</select>

<button class="main-btn blue" onclick="addBooking()">
➕ Додати запис
</button>

</div>

<div class="card">
<h2>📋 Майбутні записи</h2>
<div id="bookingList"></div>
</div>

</section>


<!-- ІСТОРІЯ -->

<section id="history" class="section">

<div class="card">

<h2>📋 Історія мийок</h2>

<div id="historyList"></div>

</div>

</section>


<!-- СПІВРОБІТНИКИ -->

<section id="workers" class="section">

<div class="card">

<h2>👥 Співробітники</h2>

<input id="workerName" placeholder="Ім'я співробітника">

<input id="workerPosition" placeholder="Посада">

<button class="main-btn blue" onclick="addWorker()">
➕ Додати співробітника
</button>

</div>

<div class="card">

<h2>👤 Команда</h2>

<div id="workerList"></div>

</div>

</section>

</div>


<script>

const services = [

    // КОМПЛЕКСИ
    {name:"🚿 Все авто", price:70, group:"all"},
    {name:"🚗 Повна зовнішня", price:50, group:"all"},
    {name:"✨ Зовнішня + салон", price:65, group:"all"},

    // КУЗОВ
    {name:"Передня частина", price:15},
    {name:"Задня частина", price:15},
    {name:"Ліва сторона", price:15},
    {name:"Права сторона", price:15},
    {name:"Дах", price:10},
    {name:"Капот", price:10},
    {name:"Багажник", price:10},

    // ФАРИ
    {name:"Фара ліва", price:10},
    {name:"Фара права", price:10},
    {name:"Лівий задній ліхтар", price:8},
    {name:"Правий задній ліхтар", price:8},

    // ДЗЕРКАЛА
    {name:"Дзеркало ліве", price:10},
    {name:"Дзеркало праве", price:10},

    // СКЛО
    {name:"Лобове скло", price:15},
    {name:"Заднє скло", price:12},
    {name:"Переднє ліве скло", price:8},
    {name:"Переднє праве скло", price:8},
    {name:"Заднє ліве скло", price:8},
    {name:"Заднє праве скло", price:8},

    // КОЛЕСА
    {name:"Переднє ліве колесо", price:10},
    {name:"Переднє праве колесо", price:10},
    {name:"Заднє ліве колесо", price:10},
    {name:"Заднє праве колесо", price:10},

    // САЛОН
    {name:"Передні сидіння", price:12},
    {name:"Задні сидіння", price:12},
    {name:"Підлога", price:12},
    {name:"Панель приладів", price:10},
    {name:"Багажник — прибирання", price:10}
];

let workers = JSON.parse(localStorage.getItem("workers") || "[]");
let bookings = JSON.parse(localStorage.getItem("bookings") || "[]");
let history = JSON.parse(localStorage.getItem("history") || "[]");

let selectedServices = [];

let timerInterval = null;
let seconds = 0;
let running = false;
let currentRate = 0;


// ВІДКРИТТЯ РОЗДІЛІВ

function showSection(id, btn) {

    document.querySelectorAll(".section").forEach(s =>
        s.classList.remove("active")
    );

    document.getElementById(id).classList.add("active");

    document.querySelectorAll("nav button").forEach(b =>
        b.classList.remove("active")
    );

    btn.classList.add("active");

    renderAll();
}


// ПОКАЗ ПОСЛУГ

function renderServices() {

    const box = document.getElementById("services");

    box.innerHTML = "";

    services.forEach((service, index) => {

        const div = document.createElement("div");

        div.className = "service";

        div.innerHTML = `
            <label>
                <input type="checkbox"
                    onchange="toggleService(${index}, this)"
                    data-index="${index}">
                ${service.name}
            </label>
            <small>💰 ${service.price} грн/хв</small>
        `;

        box.appendChild(div);
    });
}


// ВИБІР ПОСЛУГИ

function toggleService(index, checkbox) {

    const service = services[index];

    if (checkbox.checked) {

        if (service.group === "all") {

            document.querySelectorAll("#services input").forEach(input => {
                input.checked = false;
            });

            selectedServices = [];

            selectComplex(service.name);

        } else {

            selectedServices.push(service);

        }

    } else {

        selectedServices = selectedServices.filter(
            s => s.name !== service.name
        );

    }

    updateRate();
}


// ВСЕ АВТО

function selectAllCar() {

    document.querySelectorAll("#services input").forEach(input => {
        input.checked = false;
    });

    selectedServices = [];

    const everything = services.find(s => s.name === "🚿 Все авто");

    selectedServices.push(everything);

    const checkbox = [...document.querySelectorAll("#services input")]
        .find(input =>
            services[input.dataset.index].name === everything.name
        );

    if (checkbox) checkbox.checked = true;

    updateRate();
}


// КОМПЛЕКС

function selectComplex(name) {

    const service = services.find(s => s.name === name);

    if (service) selectedServices = [service];

    updateRate();
}


// ЦІНА ЗА ХВИЛИНУ

function updateRate() {

    currentRate = selectedServices.reduce(
        (sum, service) => sum + service.price,
        0
    );

    document.getElementById("rate").textContent =
        currentRate.toFixed(2);

    updateLivePrice();
}


// ТАЙМЕР

function startTimer() {

    if (running) return;

    if (selectedServices.length === 0) {
        alert("Спочатку вибери послугу!");
        return;
    }

    running = true;

    timerInterval = setInterval(() => {

        seconds++;

        updateTimer();

    }, 1000);
}


function pauseTimer() {

    running = false;

    clearInterval(timerInterval);

    timerInterval = null;
}


function updateTimer() {

    const minutes = Math.floor(seconds / 60);

    const secs = seconds % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2,"0") + ":" +
        String(secs).padStart(2,"0");

    updateLivePrice();
}


function updateLivePrice() {

    let money = (seconds / 60) * currentRate;

    document.getElementById("livePrice").textContent =
        money.toFixed(2);
}


// ЗАВЕРШЕННЯ

function finishWash() {

    if (seconds === 0) {
        alert("Мийка ще не розпочата.");
        return;
    }

    pauseTimer();

    const client = document.getElementById("clientName").value || "Без імені";

    const car =
        (document.getElementById("carBrand").value || "") +
        " " +
        (document.getElementById("carModel").value || "");

    const type = document.getElementById("carType").value || "Авто";

    const worker =
        document.getElementById("workerSelect").value || "Не вказано";

    const finalPrice = (seconds / 60) * currentRate;

    const order = {

        id: Date.now(),

        client,
        car,
        type,
        worker,

        services: selectedServices.map(s => s.name),

        seconds,

        price: finalPrice,

        date: new Date().toLocaleString("uk-UA")

    };

    history.unshift(order);

    localStorage.setItem(
        "history",
        JSON.stringify(history)
    );

    alert(
        "✅ Мийку завершено!\n\n" +
        "Клієнт: " + client +
        "\nАвто: " + car +
        "\nЧас: " + formatTime(seconds) +
        "\nСума: " + finalPrice.toFixed(2) + " грн"
    );

    resetWash();

    renderHistory();
}


// СКИДАННЯ

function resetWash() {

    pauseTimer();

    seconds = 0;

    selectedServices = [];

    currentRate = 0;

    document.getElementById("timer").textContent = "00:00";

    document.getElementById("livePrice").textContent = "0.00";

    document.getElementById("rate").textContent = "0";

    document.querySelectorAll("#services input").forEach(
        input => input.checked = false
    );
}


// СПІВРОБІТНИКИ

function addWorker() {

    const name =
        document.getElementById("workerName").value.trim();

    const position =
        document.getElementById("workerPosition").value.trim();

    if (!name) {
        alert("Введи ім'я співробітника.");
        return;
    }

    workers.push({
        id: Date.now(),
        name,
        position: position || "Співробітник"
    });

    localStorage.setItem(
        "workers",
        JSON.stringify(workers)
    );

    document.getElementById("workerName").value = "";
    document.getElementById("workerPosition").value = "";

    renderWorkers();
    updateWorkerSelect();
}


function renderWorkers() {

    const box = document.getElementById("workerList");

    box.innerHTML = "";

    if (workers.length === 0) {
        box.innerHTML = "<p>Співробітників ще немає.</p>";
        return;
    }

    workers.forEach(worker => {

        box.innerHTML += `
            <div class="order">
                <b>👤 ${worker.name}</b>
                <div class="badge">${worker.position}</div>
                <br><br>
                <button class="main-btn red"
                    onclick="deleteWorker(${worker.id})">
                    Видалити
                </button>
            </div>
        `;
    });
}


function deleteWorker(id) {

    workers = workers.filter(w => w.id !== id);

    localStorage.setItem(
        "workers",
        JSON.stringify(workers)
    );

    renderWorkers();
    updateWorkerSelect();
}


function updateWorkerSelect() {

    const select =
        document.getElementById("workerSelect");

    select.innerHTML =
        `<option value="">Оберіть співробітника</option>`;

    workers.forEach(worker => {

        select.innerHTML += `
            <option>
                ${worker.name}
            </option>
        `;
    });
}


// БРОНЮВАННЯ

function addBooking() {

    const name =
        document.getElementById("bookName").value.trim();

    const car =
        document.getElementById("bookCar").value.trim();

    const date =
        document.getElementById("bookDate").value;

    const time =
        document.getElementById("bookTime").value;

    const service =
        document.getElementById("bookService").value;

    if (!name || !car || !date || !time) {

        alert("Заповни всі поля.");

        return;
    }

    bookings.push({

        id: Date.now(),

        name,
        car,
        date,
        time,
        service

    });

    bookings.sort((a,b) =>
        (a.date + a.time).localeCompare(
            b.date + b.time
        )
    );

    localStorage.setItem(
        "bookings",
        JSON.stringify(bookings)
    );

    document.getElementById("bookName").value = "";
    document.getElementById("bookCar").value = "";

    renderBookings();
}


function renderBookings() {

    const box =
        document.getElementById("bookingList");

    box.innerHTML = "";

    if (bookings.length === 0) {

        box.innerHTML =
            "<p>Записів поки немає.</p>";

        return;
    }

    bookings.forEach(b => {

        box.innerHTML += `
            <div class="order">

                <b>👤 ${b.name}</b>

                <br>
                🚗 ${b.car}

                <br>
                📅 ${b.date}
                ⏰ ${b.time}

                <br>
                🧽 ${b.service}

                <br><br>

                <button
                    class="main-btn red"
                    onclick="deleteBooking(${b.id})">
                    Видалити
                </button>

            </div>
        `;
    });
}


function deleteBooking(id) {

    bookings =
        bookings.filter(b => b.id !== id);

    localStorage.setItem(
        "bookings",
        JSON.stringify(bookings)
    );

    renderBookings();
}


// ІСТОРІЯ

function renderHistory() {

    const box =
        document.getElementById("historyList");

    box.innerHTML = "";

    if (history.length === 0) {

        box.innerHTML =
            "<p>Історія порожня.</p>";

        return;
    }

    history.forEach(order => {

        box.innerHTML += `

        <div class="order">

            <b>🚗 ${order.car}</b>

            <br>
            👤 ${order.client}

            <br>
            👨‍🔧 ${order.worker}

            <br>
            ⏱️ ${formatTime(order.seconds)}

            <br>
            🧽 ${order.services.join(", ")}

            <br>
            📅 ${order.date}

            <div class="total">
                💰 ${order.price.toFixed(2)} грн
            </div>

        </div>

        `;
    });
}


// ФОРМАТ ЧАСУ

function formatTime(totalSeconds) {

    const minutes =
        Math.floor(totalSeconds / 60);

    const seconds =
        totalSeconds % 60;

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0")
    );
}


// ЗАПУСК

function renderAll() {

    renderWorkers();
    updateWorkerSelect();
    renderBookings();
    renderHistory();
}

renderServices();
renderAll();

</script>

</body>
</html>
